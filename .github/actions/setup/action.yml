name: Setup
description: Node from .nvmrc and dependencies from the lockfile. Run actions/checkout first.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: npm
    # --ignore-scripts: no dependency needs an install script on Linux (only fsevents, macOS-only, has one).
    - run: npm ci --ignore-scripts
      shell: bash
