name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# static (lint, astro check, unit tests) gates both builds. There is no deploy: the server builds the flake itself.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run check:contrast

  # Builds the site exactly as the server does (packages.default, check:drafts included) plus the cheap hooks.
  nix:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix flake check -L

  e2e:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      # Separate test build (dist-test/, drafts included, never deployed).
      - run: npm run build:test
      - run: npm run test:a11y
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-debug
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Single required status check for branch protection on main.
  ci-ok:
    if: always()
    needs: [static, nix, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

