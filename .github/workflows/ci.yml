name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# static (lint, astro check, unit tests) gates both builds; only a verified build reaches deploy.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run check:contrast

  build:
    needs: static
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    secrets:
      GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}

  e2e:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      # Separate test build (dist-test/, drafts included, never deployed).
      - run: npm run build:test
      - run: npm run test:a11y
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-debug
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Single required status check for branch protection on main.
  ci-ok:
    if: always()
    needs: [static, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, e2e]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
