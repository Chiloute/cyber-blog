name: Build

# Reusable: production build + embargo check, uploaded as the `site` artifact that deploy.yml ships as-is.
on:
  workflow_call:
    secrets:
      GH_PROJECTS_TOKEN:
        required: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          # Fine-grained, read-only token, never given to PR builds (they use the fallback data).
          GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GH_PROJECTS_TOKEN || '' }}
      - run: npm run check:embargo
      # Kept 30 days: re-running an old run's deploy job is the rollback path.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 30
