version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip versions younger than 7 days: most malicious npm releases are pulled within that window.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip versions younger than 7 days: most malicious npm releases are pulled within that window.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
